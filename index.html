<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Attendance Tracker</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="site-nav" aria-label="Main navigation">
    <button class="site-nav-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="site-nav-links" title="Open navigation menu"><span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span></button>
    <div class="site-nav-links" id="site-nav-links" hidden>
      <a href="index.html" aria-current="page">Home</a>
      <a href="log-in.html">Log In</a>
      <a href="hours-tracking.html">Hours Tracking</a>
      <a href="cash_inventory_website_updated.html">Cash</a>
      <a href="Housekeeping-Tracker.html">Housekeeping</a>
      <button class="site-theme-toggle" type="button" data-action-click="toggleDarkMode" data-theme-toggle aria-pressed="false">Dark Mode: Off</button>
    </div>
  </nav>
  
  <img src="QI-EL-Combo-Photo.png" 
       alt="Quality Inn Logo" class="tracker-logo">
  
<h1>Team Attendance Tracker</h1>

<div class="layout">
  <div class="panel" id="clockInPanel">
    <h2>Clock In</h2>
    <div class="field">
      <label for="inName">Your Name</label>
      <select id="inName">
        <option value="">Select your name</option>
        <option value="Dan">Dan</option>
        <option value="Brandi">Brandi</option>
        <option value="Courtney">Courtney</option>
        <option value="Janine">Janine</option>
        <option value="Jessica">Jessica</option>
        <option value="JJ">JJ</option>
        <option value="Monique">Monique</option>
        <option value="Nikki">Nikki</option>
        <option value="Skittles">Skittles</option>
        <option value="Stephanie">Stephanie</option>
        <option value="Other">Other</option>
      </select>
    </div>
    <button class="btn-in" data-action-click="handleClockIn">Clock In</button>
    <div class="status-msg" id="inStatus"></div>
  </div>

  <div class="panel" id="clockOutPanel">
    <h2>Clock Out</h2>
    <div class="field">
      <label for="outName">Your Name</label>
      <select id="outName">
        <option value="">No one is clocked in</option>
      </select>
    </div>
    <div class="field">
      <label for="outDesc">What did you work on?</label>
      <input type="text" id="outDesc" placeholder="Brief work description" autocomplete="off">
    </div>
    <button class="btn-out" data-action-click="handleClockOut">Clock Out</button>
    <div class="status-msg" id="outStatus"></div>
  </div>
  
</div>

  <div class="ot-box" id="currentlyInBox">
    <h3>Currently Clocked In</h3>
    <p>Everyone with an open clock-in and no matching clock-out yet.</p>
    <div class="alert-list" id="currentlyInList"></div>
    <div class="ot-week-summary" id="currentlyInCount"></div>
  </div>

<script src="script.js"></script>

</body>
</html>
