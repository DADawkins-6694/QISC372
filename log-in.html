<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
<nav class="site-nav" aria-label="Main navigation">
  <button class="site-nav-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="site-nav-links" title="Open navigation menu"><span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span></button>
  <div class="site-nav-links" id="site-nav-links" hidden>
    <a href="index.html">Home</a>

  </div>

<h1>Log In</h1>
<p><a href="index.html">Back to Clock In / Out</a></p>

<main class="panel records-panel">
  <div class="admin-box">
    <h2>Editing Access</h2>
    <p>Enter your editing credentials to continue to Hours Tracking.</p>
    <form class="admin-row" id="adminLoggedOut" data-action-submit="handleAdminLogin">
      <div class="field">
        <label for="adminUser">Username</label>
        <input type="text" id="adminUser" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="adminPass">Password</label>
        <input type="password" id="adminPass" autocomplete="current-password" required>
      </div>
      <button type="submit">Log In</button>
      <span class="status-msg" id="adminStatus" role="status"></span>
    </form>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
